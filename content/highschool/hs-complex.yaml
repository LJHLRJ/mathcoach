- id: hs-complex-001
  name: 复数的概念
  stage: highschool
  course: 复数
  chapter: 复数的概念
  difficulty: 基础
  source: 智能体生成
  intuition: 复数把实数轴扩展成复平面，i 是新的“旋转单位”。
  definition: 形如 a+bi（a,b∈R）的数称为复数，a 为实部，b 为虚部，i²=−1。
  mistakes: [把虚部写成 bi, 认为实数不是复数]
  example: 3+4i 的实部为 3，虚部为 4。
  exercises:
  - id: hs-complex-001-e1
    kind: choice
    stem: 下列等式正确的是（ ）
    options: ["i²=−1", "i²=1", "i²=0", "i²=i"]
    answer: "i²=−1"
    solution_outline: 这是虚数单位 i 的定义。
  - id: hs-complex-001-e2
    kind: fill
    stem: 复数 3+4i 的实部是（ ）
    answer: "3"
    solution_outline: a+bi 中 a 为实部。
  - id: hs-complex-001-e3
    kind: truefalse
    stem: 所有实数都可以看成复数。
    answer: true
    solution_outline: 实数 a 可写成 a+0i。
    variants: ["写出复数 2−5i 的实部与虚部。"]

- id: hs-complex-002
  name: 复数的运算
  stage: highschool
  course: 复数
  chapter: 复数的运算
  difficulty: 基础
  source: 智能体生成
  intuition: 复数加减法按实部、虚部分别运算，乘法按多项式展开再用 i²=−1。
  definition: (a+bi)+(c+di)=(a+c)+(b+d)i；(a+bi)(c+di)=(ac−bd)+(ad+bc)i。
  mistakes: [乘法展开后忘记 i²=−1, 加减法把实部虚部混在一起]
  example: (1+i)+(2−i)=3。
  exercises:
  - id: hs-complex-002-e1
    kind: choice
    stem: (1+i)+(2−i)=（ ）
    options: ["3", "3+2i", "1+2i", "−1"]
    answer: "3"
    solution_outline: 实部 1+2=3，虚部 1−1=0。
  - id: hs-complex-002-e2
    kind: fill
    stem: (1+i)(1−i)=（ ）
    answer: "2"
    solution_outline: 用平方差公式得 1−i²=2。
  - id: hs-complex-002-e3
    kind: expr
    stem: 计算 sqrt(1**2 + 1**2)（即 |1+i|）
    answer: "sqrt(2)"
    solution_outline: 模长公式 √(a²+b²)。
    variants: ["计算 (2+3i)−(1−i)。"]

- id: hs-complex-003
  name: 共轭复数与模
  stage: highschool
  course: 复数
  chapter: 复数的运算
  difficulty: 进阶
  source: 智能体生成
  intuition: 共轭把虚部变号，模是复平面上到原点的距离。
  definition: z=a+bi 的共轭为 a−bi，模 |z|=√(a²+b²)，且 |z|²=z·z̄。
  mistakes: [共轭只变实部, 模忘记开平方]
  example: 3+4i 的模为 5，共轭为 3−4i。
  exercises:
  - id: hs-complex-003-e1
    kind: choice
    stem: 复数 3+4i 的模是（ ）
    options: ["3", "4", "5", "7"]
    answer: "5"
    solution_outline: √(3²+4²)=5。
  - id: hs-complex-003-e2
    kind: fill
    stem: 复数 2−3i 的共轭是（ ）
    answer: "2+3i"
    solution_outline: 虚部变号。
  - id: hs-complex-003-e3
    kind: truefalse
    stem: 对任意复数 z，都有 |z|²=z·z̄。
    answer: true
    solution_outline: 设 z=a+bi，直接计算即可验证。
    variants: ["求复数 1−2i 的模。"]

- id: hs-complex-004
  name: 复平面
  stage: highschool
  course: 复数
  chapter: 复数的几何意义
  difficulty: 进阶
  source: 智能体生成
  intuition: 复数 a+bi 对应复平面上的点 (a,b)。
  definition: 实部对应横坐标，虚部对应纵坐标；复数与复平面内的点一一对应。
  mistakes: [横纵坐标写反, 忽略象限符号]
  example: 1+i 对应第一象限的点 (1,1)。
  exercises:
  - id: hs-complex-004-e1
    kind: choice
    stem: 复数 1+i 对应的点位于（ ）
    options: ["第一象限", "第二象限", "第三象限", "第四象限"]
    answer: "第一象限"
    solution_outline: 横纵坐标都为正。
  - id: hs-complex-004-e2
    kind: fill
    stem: 复数 1+i 的模是（ ）
    answer: "√2"
    solution_outline: √(1²+1²)=√2。
  - id: hs-complex-004-e3
    kind: match
    stem: 把复数与所在象限配对（写成 A=1;B=2 的形式）
    options: ["A 1+i", "B −1+i", "1 第一象限", "2 第二象限"]
    answer: "A=1;B=2"
    solution_outline: (1,1) 在第一象限，(−1,1) 在第二象限。
    variants: ["判断复数 −2−3i 对应的象限。"]

- id: hs-complex-005
  name: 复数方程
  stage: highschool
  course: 复数
  chapter: 复数方程
  difficulty: 挑战
  source: 智能体生成
  intuition: 在复数范围内，负数也可以开平方。
  definition: 方程 z²=−1 的两个根为 z=±i；实系数一元二次方程在判别式为负时有一对共轭复根。
  mistakes: [认为 z²=−1 无解, 漏掉负根]
  example: z²+1=0 的解为 z=±i。
  exercises:
  - id: hs-complex-005-e1
    kind: choice
    stem: 方程 z²+1=0 的根是（ ）
    options: ["z=±i", "z=±1", "z=i", "z=0"]
    answer: "z=±i"
    solution_outline: z²=−1，所以 z=±i。
  - id: hs-complex-005-e2
    kind: fill
    stem: 方程 z²=−1 的一个根是（ ）
    answer: "i"
    solution_outline: i²=−1。
  - id: hs-complex-005-e3
    kind: find_error
    stem: 解方程 z²=−4，哪一步错了（ ）
    options: ["第 1 步：z²=−4", "第 2 步：z=±2i", "第 3 步：方程无实数解所以无解"]
    answer: "第 3 步：方程无实数解所以无解"
    solution_outline: 在复数范围内有解 z=±2i。
    variants: ["解方程 z²+9=0。"]
