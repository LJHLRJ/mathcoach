- id: hs-func-002
  name: 函数的定义域
  stage: highschool
  course: 函数与导数
  chapter: 函数概念
  difficulty: 基础
  source: 智能体生成
  intuition: 定义域就是让解析式“有意义”的输入范围。
  definition: 使函数解析式有意义的自变量取值集合称为定义域；分母不为零、偶次根号内非负、对数真数为正。
  mistakes: [只记解析式不看定义域, 把根号内非负写成大于零]
  example: f(x)=√(x−2) 的定义域是 [2,+∞)。
  exercises:
  - id: hs-func-002-e1
    grade: g10
    difficulty: basic
    kind: choice
    stem: 函数 f(x)=√(x−2) 的定义域是（ ）
    options: ["x ≥ 2", "x > 2", "x ≤ 2", "全体实数"]
    answer: "x ≥ 2"
    solution_outline: 根号内非负，即 x−2≥0。
  - id: hs-func-002-e2
    grade: g10
    difficulty: basic
    kind: fill
    stem: 函数 f(x)=1/(x−1) 的定义域是（ ）
    answer: "x≠1"
    solution_outline: 分母不能为零，所以 x−1≠0。
  - id: hs-func-002-e3
    grade: g10
    difficulty: basic
    kind: truefalse
    stem: f(x)=x² 与 g(x)=x 的定义域相同。
    answer: true
    solution_outline: 两个解析式都对全体实数有意义，定义域都是 R。
    variants: ["求 f(x)=√(3−x) 的定义域。"]

- id: hs-func-003
  name: 函数的单调性
  stage: highschool
  course: 函数与导数
  chapter: 函数性质
  difficulty: 进阶
  source: 智能体生成
  intuition: 单调性描述自变量增大时函数值整体往上还是往下走。
  definition: 在区间 I 上，若 x1<x2 时总有 f(x1)<f(x2)，则 f 在 I 上单调递增；若总有 f(x1)>f(x2)，则单调递减。
  mistakes: [用两个特殊点代替任意两点, 忽略单调性依赖的区间]
  example: f(x)=x² 在 [0,+∞) 上单调递增，在 (−∞,0] 上单调递减。
  exercises:
  - id: hs-func-003-e1
    grade: g10
    difficulty: intermediate
    kind: choice
    stem: 函数 f(x)=x² 在区间 [0,+∞) 上（ ）
    options: ["单调递增", "单调递减", "先增后减", "没有单调性"]
    answer: "单调递增"
    solution_outline: x1<x2 时 x2²−x1²=(x2−x1)(x2+x1)>0。
  - id: hs-func-003-e2
    grade: g10
    difficulty: intermediate
    kind: fill
    stem: 一次函数 f(x)=2x+1 的斜率为（ ）
    answer: "2"
    solution_outline: 一次函数 y=kx+b 的斜率就是 k。
  - id: hs-func-003-e3
    grade: g10
    difficulty: intermediate
    kind: find_error
    stem: 判断 f(x)=x² 在 [−1,1] 上的单调性，哪一步错了（ ）
    options: ["第 1 步：设 x1<x2", "第 2 步：f(x2)−f(x1)=(x2−x1)(x2+x1)", "第 3 步：由 x2−x1>0 断言整个区间递增"]
    answer: "第 3 步：由 x2−x1>0 断言整个区间递增"
    solution_outline: 还要看 x2+x1 的符号，在 [−1,1] 上它可能正也可能负。
    variants: ["判断 f(x)=−x+3 的单调性。"]

- id: hs-func-004
  name: 导数的几何意义
  stage: highschool
  course: 函数与导数
  chapter: 导数
  difficulty: 进阶
  source: 智能体生成
  intuition: 导数就是曲线在某一点切线的倾斜程度。
  definition: f′(x0) 是曲线 y=f(x) 在点 (x0,f(x0)) 处切线的斜率；切线方程为 y−f(x0)=f′(x0)(x−x0)。
  mistakes: [把导数值当成函数值, 切线方程漏掉点坐标]
  example: y=x² 在 x=1 处的导数为 2，切线斜率为 2。
  exercises:
  - id: hs-func-004-e1
    grade: g10
    difficulty: intermediate
    kind: choice
    stem: f′(x0) 的几何意义是（ ）
    options: ["曲线在 x0 处的切线斜率", "曲线在 x0 处的函数值", "曲线与 x 轴交点", "曲线的长度"]
    answer: "曲线在 x0 处的切线斜率"
    solution_outline: 导数的定义就是割线斜率的极限，即切线斜率。
  - id: hs-func-004-e2
    grade: g10
    difficulty: intermediate
    kind: fill
    stem: 函数 f(x)=x³ 在 x=1 处的导数为（ ）
    answer: "3"
    solution_outline: f′(x)=3x²，代入 x=1 得 3。
  - id: hs-func-004-e3
    grade: g10
    difficulty: intermediate
    kind: expr
    stem: 用 x 表示 f(x)=x³ 的导函数（如 3*x**2）
    answer: "3*x**2"
    solution_outline: 幂函数求导公式 (x^n)′=n·x^(n−1)。
    variants: ["求 f(x)=x²+2x 的导数。"]

- id: hs-func-005
  name: 导数与极值
  stage: highschool
  course: 函数与导数
  chapter: 导数
  difficulty: 挑战
  source: 智能体生成
  intuition: 极值点看导数变号，不只看导数为零。
  definition: 若 f′(x0)=0 且 f′ 在 x0 两侧异号，则 x0 是极值点；f′(x0)=0 只是驻点，不一定是极值点。
  mistakes: [把驻点都当成极值点, 忘记检查导数符号变化]
  example: f(x)=x³ 在 x=0 处导数为 0，但函数单调递增，没有极值。
  exercises:
  - id: hs-func-005-e1
    grade: g10
    difficulty: challenge
    kind: choice
    stem: 函数 f(x)=x³ 在 x=0 处（ ）
    options: ["取得极大值", "取得极小值", "不是极值点", "无法判断"]
    answer: "不是极值点"
    solution_outline: 导数为 0，但两侧导数都为正，函数单调递增。
  - id: hs-func-005-e2
    grade: g10
    difficulty: challenge
    kind: fill
    stem: 函数 f(x)=x²−2x 取得最小值的 x 为（ ）
    answer: "1"
    solution_outline: f′(x)=2x−2，令其为 0 得 x=1。
  - id: hs-func-005-e3
    grade: g10
    difficulty: challenge
    kind: proof_order
    stem: 把求可导函数极值的步骤排成正确顺序（用逗号分隔）
    answer: "1,2,3,4"
    solution_outline: 求导、找驻点、判断导数符号变化、确定极值。
    variants: ["求 f(x)=x³−3x 的极值点。"]

- id: hs-func-006
  name: 导数的应用
  stage: highschool
  course: 函数与导数
  chapter: 导数
  difficulty: 进阶
  source: 智能体生成
  intuition: 导数可以判断增减、求最优化问题。
  definition: 在闭区间上连续的函数必有最大值和最小值，可通过比较端点和驻点处的函数值得到。
  mistakes: [只比较驻点忽略端点, 把极大值当成最大值]
  example: f(x)=x² 在 [−1,2] 上的最小值为 0，最大值为 4。
  exercises:
  - id: hs-func-006-e1
    grade: g10
    difficulty: intermediate
    kind: choice
    stem: 求闭区间上函数最值时，必须比较（ ）
    options: ["只比较驻点", "只比较端点", "驻点和端点", "只比较零点"]
    answer: "驻点和端点"
    solution_outline: 最值可能出现在驻点或区间端点。
  - id: hs-func-006-e2
    grade: g10
    difficulty: intermediate
    kind: fill
    stem: f(x)=x² 在 [−1,2] 上的最大值为（ ）
    answer: "4"
    solution_outline: 比较 f(−1)=1、f(0)=0、f(2)=4，最大值为 4。
  - id: hs-func-006-e3
    grade: g10
    difficulty: intermediate
    kind: truefalse
    stem: 函数的极大值一定大于极小值。
    answer: false
    solution_outline: 极大值和极小值是局部概念，不同位置的极值不能直接比较。
    variants: ["求 f(x)=x³−3x 在 [−2,2] 上的最值。"]
