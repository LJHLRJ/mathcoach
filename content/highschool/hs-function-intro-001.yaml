id: hs-function-intro-001
name: 函数的概念
stage: highschool
course: 函数与导数
chapter: 函数概念
difficulty: 基础
source: 智能体生成
intuition: 函数像一台“输入一个数、吐出一个数”的机器，同一个输入只能得到唯一输出。
definition: 设 A、B 是非空数集，若按某个对应关系 f，对 A 中任意 x，B 中都有唯一确定的 y 与之对应，则称 f 为从 A 到 B 的函数。
mistakes:
  - 把“一个 x 对应两个 y”的关系当成函数
  - 只看解析式，忽略定义域限制
example: y = x² 是函数；x² + y² = 1 中 x = 0 时 y 有两个值，不是函数。
exercises:
  - id: hs-function-intro-001-e1
    grade: g10
    difficulty: basic
    kind: choice
    stem: 下列对应关系中，y 是 x 的函数的是（ ）
    options: [y = x², x² + y² = 1, y² = x, x = 1]
    answer: y = x²
    solution_outline: 每个 x 只有唯一 y 与之对应；其余关系会出现一个 x 对应两个 y。
  - id: hs-function-intro-001-e2
    grade: g10
    difficulty: basic
    kind: choice
    stem: 函数 f(x) = √(x-2) 的定义域是（ ）
    options: [x ≥ 2, x > 2, x ≤ 2, 全体实数]
    answer: x ≥ 2
    solution_outline: 根号内非负，即 x - 2 ≥ 0。
  - id: hs-function-intro-001-e3
    grade: g10
    difficulty: basic
    kind: choice
    stem: 若 f(x) = 2x + 1，则 f(3) =（ ）
    options: ["5", "6", "7", "8"]
    answer: "7"
    solution_outline: 代入 x = 3，2×3 + 1 = 7。
    variants: ["若 f(x) = 3x - 1，则 f(2) = ?"]
