- id: hs-seq-001
  name: 数列的概念
  stage: highschool
  course: 数列
  chapter: 数列基础
  difficulty: 基础
  source: 智能体生成
  intuition: 数列就是一列按顺序排好的数，每一项由它的位置决定。
  definition: 按一定顺序排列的一列数称为数列；a_n 表示第 n 项，n 为正整数。
  mistakes: [把数列当成集合, 忽略项的顺序]
  example: 数列 1,3,5,7,… 的通项公式可以是 a_n=2n−1。
  exercises:
  - id: hs-seq-001-e1
    kind: choice
    stem: 数列 a_n=2n−1 的第 2 项是（ ）
    options: ["1", "3", "5", "7"]
    answer: "3"
    solution_outline: 代入 n=2，得 2×2−1=3。
  - id: hs-seq-001-e2
    kind: fill
    stem: 若 a_n=n²，则 a_3=（ ）
    answer: "9"
    solution_outline: 代入 n=3，得 3²=9。
  - id: hs-seq-001-e3
    kind: truefalse
    stem: 数列可以看成定义在正整数集上的函数。
    answer: true
    solution_outline: 每一项由下标 n 唯一确定。
    variants: ["写出数列 2,4,6,8,… 的一个通项公式。"]

- id: hs-seq-002
  name: 等差数列
  stage: highschool
  course: 数列
  chapter: 等差数列
  difficulty: 基础
  source: 智能体生成
  intuition: 等差数列每一步加同一个数。
  definition: 若 a_{n+1}−a_n=d 为常数，则 {a_n} 为等差数列，通项 a_n=a_1+(n−1)d。
  mistakes: [公差算成后项减前项的反向, 项数数错]
  example: a_1=2，d=3，则 a_5=2+4×3=14。
  exercises:
  - id: hs-seq-002-e1
    kind: choice
    stem: 等差数列首项为 2，公差为 3，则第 5 项为（ ）
    options: ["11", "14", "17", "20"]
    answer: "14"
    solution_outline: a_5=2+(5−1)×3=14。
  - id: hs-seq-002-e2
    kind: fill
    stem: 1+2+3+…+10=（ ）
    answer: "55"
    solution_outline: 等差数列求和 (1+10)×10/2=55。
  - id: hs-seq-002-e3
    kind: expr
    stem: 首项 2、公差 3 的等差数列通项公式（用 n 表示，如 3*n-1）
    answer: "3*n-1"
    solution_outline: a_n=2+(n−1)×3=3n−1。
    variants: ["等差数列首项 5、公差 −2，求第 6 项。"]

- id: hs-seq-003
  name: 等比数列
  stage: highschool
  course: 数列
  chapter: 等比数列
  difficulty: 进阶
  source: 智能体生成
  intuition: 等比数列每一步乘同一个数。
  definition: 若 a_{n+1}/a_n=q（q≠0）为常数，则 {a_n} 为等比数列，通项 a_n=a_1 q^{n−1}。
  mistakes: [公比允许为 0, 忽视正负交替]
  example: 2,4,8,16 是首项 2、公比 2 的等比数列。
  exercises:
  - id: hs-seq-003-e1
    kind: choice
    stem: 等比数列 2,4,8,… 的下一项是（ ）
    options: ["10", "12", "16", "18"]
    answer: "16"
    solution_outline: 公比为 2，下一项为 8×2=16。
  - id: hs-seq-003-e2
    kind: fill
    stem: 首项 1、公比 2 的等比数列第 6 项是（ ）
    answer: "32"
    solution_outline: a_6=1×2^5=32。
  - id: hs-seq-003-e3
    kind: truefalse
    stem: 等比数列的公比不能为 0。
    answer: true
    solution_outline: 公比为 0 会使后项全为 0，无法满足定义中的比值。
    variants: ["求 3,6,12,24 的公比与第 5 项。"]

- id: hs-seq-004
  name: 数列求和
  stage: highschool
  course: 数列
  chapter: 数列求和
  difficulty: 进阶
  source: 智能体生成
  intuition: 求和先看结构，等差用倒序相加，等比用公式，差比用错位相减。
  definition: 等差数列前 n 项和 S_n=n(a_1+a_n)/2；等比数列 S_n=a_1(1−q^n)/(1−q)（q≠1）。
  mistakes: [等比求和忘记讨论 q=1, 错位相减符号出错]
  example: 1+2+…+n=n(n+1)/2。
  exercises:
  - id: hs-seq-004-e1
    kind: choice
    stem: 1+2+…+n 的和为（ ）
    options: ["n(n+1)/2", "n(n−1)/2", "n²", "2n"]
    answer: "n(n+1)/2"
    solution_outline: 倒序相加得到 n(n+1)/2。
  - id: hs-seq-004-e2
    kind: fill
    stem: 1+2+4+8=（ ）
    answer: "15"
    solution_outline: 等比数列求和 (1−2^4)/(1−2)=15。
  - id: hs-seq-004-e3
    kind: proof_order
    stem: 用错位相减法求和的步骤排序（用逗号分隔）
    answer: "1,2,3,4"
    solution_outline: 写 S_n、乘公比、错位相减、化简求 S_n。
    variants: ["求 2+4+8+…+2^10。"]

- id: hs-seq-005
  name: 递推数列
  stage: highschool
  course: 数列
  chapter: 递推与通项
  difficulty: 挑战
  source: 智能体生成
  intuition: 递推公式告诉你“下一项怎么由前一项得到”。
  definition: 用前项表示后项的等式称为递推关系；累加、累乘是常见求通项方法。
  mistakes: [递推式代入时下标错位, 忘记初始项]
  example: a_1=1，a_{n+1}=a_n+2，则数列为 1,3,5,7,…。
  exercises:
  - id: hs-seq-005-e1
    kind: choice
    stem: 斐波那契数列的递推关系是（ ）
    options: ["a_{n+2}=a_{n+1}+a_n", "a_{n+2}=a_{n+1}−a_n", "a_{n+1}=2a_n", "a_{n+1}=a_n+n"]
    answer: "a_{n+2}=a_{n+1}+a_n"
    solution_outline: 每一项等于前两项之和。
  - id: hs-seq-005-e2
    kind: fill
    stem: a_1=1，a_{n+1}=a_n+2，则 a_4=（ ）
    answer: "7"
    solution_outline: 依次得 1,3,5,7。
  - id: hs-seq-005-e3
    kind: find_error
    stem: 由 a_1=1，a_{n+1}=2a_n 求 a_3，哪一步错了（ ）
    options: ["第 1 步：a_2=2a_1=2", "第 2 步：a_3=2a_2=4", "第 3 步：a_3=6"]
    answer: "第 3 步：a_3=6"
    solution_outline: 按递推关系 a_3 应为 4。
    variants: ["a_1=2，a_{n+1}=a_n+3，求 a_5。"]
