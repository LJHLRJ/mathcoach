- id: grad-functional-001
  name: 度量空间
  stage: graduate
  course: 泛函分析
  chapter: 度量空间
  difficulty: 基础
  source: 智能体生成
  intuition: 度量空间用距离函数刻画“远近”。
  definition: 距离 d(x,y) 满足非负性、对称性、三角不等式，且 d(x,y)=0 当且仅当 x=y。
  mistakes: [忽略三角不等式, 把伪度量当成度量]
  example: R^n 上的欧氏距离构成度量。
  exercises:
  - id: grad-functional-001-e1
    grade: mixed
    difficulty: basic
    kind: choice
    stem: 度量 d 必须满足（ ）
    options: ["三角不等式", "线性性", "d(x,y)=d(y,x)+1", "d(x,x)>0"]
    answer: "三角不等式"
    solution_outline: 三角不等式是度量公理之一。
  - id: grad-functional-001-e2
    grade: mixed
    difficulty: basic
    kind: fill
    stem: 度量空间中 d(x,y)=0 当且仅当（ ）
    answer: "x=y"
    solution_outline: 同一性公理。
  - id: grad-functional-001-e3
    grade: mixed
    difficulty: basic
    kind: truefalse
    stem: 度量必须是对称的。
    answer: true
    solution_outline: d(x,y)=d(y,x)。
    variants: ["验证离散度量是否满足三角不等式。"]

- id: grad-functional-002
  name: 完备性与巴拿赫空间
  stage: graduate
  course: 泛函分析
  chapter: 完备性
  difficulty: 基础
  source: 智能体生成
  intuition: 完备空间里柯西列一定收敛，不会“漏掉极限”。
  definition: 每个柯西列都收敛的赋范空间称为巴拿赫空间。
  mistakes: [把柯西列与收敛列混为一谈, 忽略空间是否完备]
  example: R^n 在欧氏范数下是巴拿赫空间。
  exercises:
  - id: grad-functional-002-e1
    grade: mixed
    difficulty: basic
    kind: choice
    stem: 巴拿赫空间是（ ）
    options: ["完备的赋范空间", "任意内积空间", "有限维空间", "紧空间"]
    answer: "完备的赋范空间"
    solution_outline: 巴拿赫空间的定义是完备赋范空间。
  - id: grad-functional-002-e2
    grade: mixed
    difficulty: basic
    kind: fill
    stem: 在完备空间中，柯西列一定（ ）
    answer: "收敛"
    solution_outline: 完备性的定义。
  - id: grad-functional-002-e3
    grade: mixed
    difficulty: basic
    kind: truefalse
    stem: 有理数集 Q 在通常度量下是完备的。
    answer: false
    solution_outline: 例如 √2 的有理数逼近列在 Q 中不收敛。
    variants: ["举例说明 (0,1) 在通常度量下不完备。"]

- id: grad-functional-003
  name: 内积与希尔伯特空间
  stage: graduate
  course: 泛函分析
  chapter: 希尔伯特空间
  difficulty: 进阶
  source: 智能体生成
  intuition: 内积空间能定义角度与正交，完备后成为希尔伯特空间。
  definition: 内积 ⟨x,y⟩ 满足线性、共轭对称、正定性；完备内积空间称为希尔伯特空间。
  mistakes: [混淆内积与范数, 忽略共轭对称]
  example: L² 空间在平方可积函数上构成希尔伯特空间。
  exercises:
  - id: grad-functional-003-e1
    grade: mixed
    difficulty: intermediate
    kind: choice
    stem: 由内积诱导的范数是（ ）
    options: ["||x||=√⟨x,x⟩", "||x||=⟨x,x⟩", "||x||=⟨x,y⟩", "||x||=x"]
    answer: "||x||=√⟨x,x⟩"
    solution_outline: 内积诱导范数的标准定义。
  - id: grad-functional-003-e2
    grade: mixed
    difficulty: intermediate
    kind: fill
    stem: 柯西-施瓦茨不等式为 |⟨x,y⟩|≤（ ）
    answer: "||x||·||y||"
    solution_outline: 内积空间的基本不等式。
  - id: grad-functional-003-e3
    grade: mixed
    difficulty: intermediate
    kind: truefalse
    stem: 希尔伯特空间一定是巴拿赫空间。
    answer: true
    solution_outline: 内积诱导范数，完备内积空间也是完备赋范空间。
    variants: ["写出 L²[0,1] 的内积定义。"]

- id: grad-functional-004
  name: 有界线性算子
  stage: graduate
  course: 泛函分析
  chapter: 线性算子
  difficulty: 进阶
  source: 智能体生成
  intuition: 有界算子不会把有界集“拉爆”，等价于连续。
  definition: 线性算子 T 有界当且仅当存在 M 使 ||Tx||≤M||x||；有界等价于连续。
  mistakes: [把有界算子理解成值域有界, 忽略线性性]
  example: 矩阵乘法在有限维空间上是有界线性算子。
  exercises:
  - id: grad-functional-004-e1
    grade: mixed
    difficulty: intermediate
    kind: choice
    stem: 线性算子有界等价于（ ）
    options: ["连续", "可逆", "满射", "紧"]
    answer: "连续"
    solution_outline: 线性算子有界与连续等价。
  - id: grad-functional-004-e2
    grade: mixed
    difficulty: intermediate
    kind: fill
    stem: 有界线性算子 T 的算子范数定义为 sup_{x≠0}（ ）
    answer: "||Tx||/||x||"
    solution_outline: 算子范数衡量最大伸缩比例。
  - id: grad-functional-004-e3
    grade: mixed
    difficulty: intermediate
    kind: find_error
    stem: 判断线性算子是否有界，哪一步错了（ ）
    options: ["第 1 步：寻找常数 M", "第 2 步：验证 ||Tx||≤M||x||", "第 3 步：只验证 ||T0||=0 就断言有界"]
    answer: "第 3 步：只验证 ||T0||=0 就断言有界"
    solution_outline: 必须在所有 x 上验证一致界，不能只看零向量。
    variants: ["证明有限维空间上的线性算子都有界。"]

- id: grad-functional-005
  name: 对偶空间
  stage: graduate
  course: 泛函分析
  chapter: 对偶空间
  difficulty: 挑战
  source: 智能体生成
  intuition: 对偶空间由作用在向量上的连续线性泛函组成。
  definition: X 的对偶空间 X* 是 X 上全体有界线性泛函构成的空间。
  mistakes: [把对偶空间与原空间混淆, 忽略连续性与有界性]
  example: R^n 上的线性泛函都可以写成与某个向量的内积。
  exercises:
  - id: grad-functional-005-e1
    grade: mixed
    difficulty: challenge
    kind: choice
    stem: 对偶空间 X* 中的元素是（ ）
    options: ["有界线性泛函", "向量", "子空间", "紧集"]
    answer: "有界线性泛函"
    solution_outline: 对偶空间由连续线性泛函构成。
  - id: grad-functional-005-e2
    grade: mixed
    difficulty: challenge
    kind: fill
    stem: 希尔伯特空间的自对偶性通过（ ）定理给出
    answer: "Riesz"
    solution_outline: Riesz 表示定理。
  - id: grad-functional-005-e3
    grade: mixed
    difficulty: challenge
    kind: truefalse
    stem: 有限维空间中每个线性泛函都是有界的。
    answer: true
    solution_outline: 有限维空间中线性泛函自动有界。
    variants: ["写出 L² 空间上的一个线性泛函。"]

- id: grad-functional-006
  name: 基本定理
  stage: graduate
  course: 泛函分析
  chapter: 基本定理
  difficulty: 挑战
  source: 智能体生成
  intuition: 三大基本定理给出泛函分析中“存在性”的核心工具。
  definition: Hahn-Banach 定理保证泛函延拓；开映射定理、闭图像定理联系有界性与连续性。
  mistakes: [混淆开映射与连续映射, 忽略空间完备性前提]
  example: 闭图像定理要求定义域与值域都是巴拿赫空间。
  exercises:
  - id: grad-functional-006-e1
    grade: mixed
    difficulty: challenge
    kind: choice
    stem: 保证线性泛函可延拓的定理是（ ）
    options: ["Hahn-Banach 定理", "开映射定理", "闭图像定理", "Riesz 表示定理"]
    answer: "Hahn-Banach 定理"
    solution_outline: Hahn-Banach 定理处理延拓问题。
  - id: grad-functional-006-e2
    grade: mixed
    difficulty: challenge
    kind: fill
    stem: 开映射定理说明满射有界线性算子把开集映为（ ）
    answer: "开集"
    solution_outline: 这正是开映射定理的结论。
  - id: grad-functional-006-e3
    grade: mixed
    difficulty: challenge
    kind: match
    stem: 把定理与结论配对（写成 A=1;B=2 的形式）
    options: ["A 闭图像定理", "B 开映射定理", "1 闭图像推出有界", "2 满射算子开"]
    answer: "A=1;B=2"
    solution_outline: 闭图像定理判定有界性，开映射定理讨论满射。
    variants: ["叙述 Hahn-Banach 定理的延拓结论。"]
