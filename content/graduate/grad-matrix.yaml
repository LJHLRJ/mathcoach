- id: grad-matrix-001
  name: 线性空间
  stage: graduate
  course: 矩阵论
  chapter: 线性空间
  difficulty: 基础
  source: 智能体生成
  intuition: 线性空间是能做加法与数乘并满足八条公理的集合。
  definition: 线性空间 V 对加法与数乘封闭，并满足交换律、结合律、零元、负元、分配律等公理。
  mistakes: [只验证封闭性忽略公理, 把任意集合当成线性空间]
  example: R³ 按通常的向量加法与数乘构成线性空间。
  exercises:
  - id: grad-matrix-001-e1
    grade: m1
    difficulty: basic
    kind: choice
    stem: 线性空间必须对下列哪种运算封闭（ ）
    options: ["加法与数乘", "加法与乘法", "只有加法", "只有数乘"]
    answer: "加法与数乘"
    solution_outline: 线性空间的定义要求对加法与数乘封闭。
  - id: grad-matrix-001-e2
    grade: m1
    difficulty: basic
    kind: fill
    stem: R³ 的维数是（ ）
    answer: "3"
    solution_outline: 标准基含 3 个向量。
  - id: grad-matrix-001-e3
    grade: m1
    difficulty: basic
    kind: truefalse
    stem: 线性空间中零向量是唯一的。
    answer: true
    solution_outline: 由零元公理可证明唯一性。
    variants: ["判断全体正实数按普通乘法是否构成线性空间。"]

- id: grad-matrix-002
  name: 基与维数
  stage: graduate
  course: 矩阵论
  chapter: 基与维数
  difficulty: 基础
  source: 智能体生成
  intuition: 基是“最少且能生成整个空间”的向量组。
  definition: 线性无关且能生成 V 的向量组称为 V 的基，基中向量个数称为维数。
  mistakes: [把生成组当基, 忽略线性无关]
  example: "{(1,0),(0,1)} 是 R² 的一组基。"
  exercises:
  - id: grad-matrix-002-e1
    grade: m1
    difficulty: basic
    kind: choice
    stem: 成为基的条件是（ ）
    options: ["线性无关且能生成空间", "线性相关且能生成空间", "只线性无关", "只含零向量"]
    answer: "线性无关且能生成空间"
    solution_outline: 基必须同时满足线性无关与生成性。
  - id: grad-matrix-002-e2
    grade: m1
    difficulty: basic
    kind: fill
    stem: 次数不超过 2 的多项式空间维数是（ ）
    answer: "3"
    solution_outline: 基为 1、x、x²。
  - id: grad-matrix-002-e3
    grade: m1
    difficulty: basic
    kind: multi
    stem: 下列向量组中能作为 R² 的基的是（ ）
    options: ["(1,0),(0,1)", "(1,1),(2,2)", "(1,0),(1,1)", "(0,0),(1,1)"]
    answer: ["(1,0),(0,1)", "(1,0),(1,1)"]
    solution_outline: 两组都线性无关且含两个向量。
    variants: ["求 R⁴ 的标准基。"]

- id: grad-matrix-003
  name: 线性变换
  stage: graduate
  course: 矩阵论
  chapter: 线性变换
  difficulty: 进阶
  source: 智能体生成
  intuition: 选好基后，线性变换可以用矩阵表示。
  definition: 线性变换 T 满足 T(αx+βy)=αT(x)+βT(y)；在给定基下对应一个矩阵。
  mistakes: [把线性变换与一般函数混淆, 换基后忘记相似变换]
  example: 旋转变换在标准基下对应旋转矩阵。
  exercises:
  - id: grad-matrix-003-e1
    grade: m1
    difficulty: intermediate
    kind: choice
    stem: 线性变换必须满足（ ）
    options: ["T(αx+βy)=αT(x)+βT(y)", "T(x+y)=T(x)T(y)", "T(0)=1", "T 必须是常数"]
    answer: "T(αx+βy)=αT(x)+βT(y)"
    solution_outline: 这是线性性的定义。
  - id: grad-matrix-003-e2
    grade: m1
    difficulty: intermediate
    kind: fill
    stem: 线性变换在不同基下的矩阵之间的关系是（ ）
    answer: "相似"
    solution_outline: 同一线性变换在不同基下的矩阵相似。
  - id: grad-matrix-003-e3
    grade: m1
    difficulty: intermediate
    kind: truefalse
    stem: 线性变换把零向量映为零向量。
    answer: true
    solution_outline: 由 T(0)=T(0+0)=2T(0) 得 T(0)=0。
    variants: ["写出 R² 中绕原点旋转 90° 的矩阵。"]

- id: grad-matrix-004
  name: 特征值与对角化
  stage: graduate
  course: 矩阵论
  chapter: 特征值
  difficulty: 进阶
  source: 智能体生成
  intuition: 对角化就是找到一组特征向量基，使矩阵变成对角形。
  definition: n 阶矩阵 A 可对角化当且仅当它有 n 个线性无关的特征向量。
  mistakes: [以为有重特征值就不能对角化, 忽略特征向量个数]
  example: 对角矩阵本身已经对角化。
  exercises:
  - id: grad-matrix-004-e1
    grade: m1
    difficulty: intermediate
    kind: choice
    stem: n 阶矩阵 A 可对角化的充要条件是（ ）
    options: ["有 n 个线性无关的特征向量", "特征值互不相同", "A 对称", "det A≠0"]
    answer: "有 n 个线性无关的特征向量"
    solution_outline: 特征向量构成可逆矩阵即可对角化。
  - id: grad-matrix-004-e2
    grade: m1
    difficulty: intermediate
    kind: fill
    stem: 矩阵 diag(2,2,3) 的特征值是（ ）
    answer: "2,2,3"
    solution_outline: 对角矩阵的特征值即对角元。
  - id: grad-matrix-004-e3
    grade: m1
    difficulty: intermediate
    kind: find_error
    stem: 判断矩阵 [[1,1],[0,1]] 是否可对角化，哪一步错了（ ）
    options: ["第 1 步：特征值为 1（二重）", "第 2 步：特征空间维数为 1", "第 3 步：所以有 2 个线性无关特征向量，可对角化"]
    answer: "第 3 步：所以有 2 个线性无关特征向量，可对角化"
    solution_outline: 特征空间维数为 1，只有一个线性无关特征向量，不可对角化。
    variants: ["判断 diag(1,2,3) 是否可对角化。"]

- id: grad-matrix-005
  name: Jordan 标准形
  stage: graduate
  course: 矩阵论
  chapter: Jordan 标准形
  difficulty: 挑战
  source: 智能体生成
  intuition: 不可对角化的矩阵也能化成接近对角的分块形式。
  definition: 每个复矩阵都相似于唯一的 Jordan 标准形；Jordan 块数量等于几何重数。
  mistakes: [把代数重数当成 Jordan 块数, 忽略幂零部分]
  example: "[[1,1],[0,1]] 本身就是一个 2 阶 Jordan 块。"
  exercises:
  - id: grad-matrix-005-e1
    grade: m1
    difficulty: challenge
    kind: choice
    stem: 与矩阵 [[1,1],[0,1]] 相似的 Jordan 标准形是（ ）
    options: ["一个 2 阶 Jordan 块", "两个 1 阶 Jordan 块", "对角矩阵 diag(1,1)", "零矩阵"]
    answer: "一个 2 阶 Jordan 块"
    solution_outline: 该矩阵本身即为 2 阶 Jordan 块。
  - id: grad-matrix-005-e2
    grade: m1
    difficulty: challenge
    kind: fill
    stem: Jordan 块的个数等于特征值的（ ）重数
    answer: "几何"
    solution_outline: 每个 Jordan 块对应一个线性无关特征向量。
  - id: grad-matrix-005-e3
    grade: m1
    difficulty: challenge
    kind: truefalse
    stem: 任意复矩阵都相似于一个 Jordan 标准形。
    answer: true
    solution_outline: 这是 Jordan 标准形存在定理。
    variants: ["写出 3 阶 Jordan 块 J_3(λ) 的形式。"]

- id: grad-matrix-006
  name: 矩阵分解
  stage: graduate
  course: 矩阵论
  chapter: 矩阵分解
  difficulty: 挑战
  source: 智能体生成
  intuition: 分解把复杂矩阵拆成性质更好的矩阵乘积。
  definition: LU 分解 A=LU；QR 分解 A=QR；奇异值分解 A=UΣV^T。
  mistakes: [LU 分解忽略主元交换, 把 SVD 的奇异值当成特征值]
  example: 可逆矩阵在适当条件下可做 LU 分解。
  exercises:
  - id: grad-matrix-006-e1
    grade: m1
    difficulty: challenge
    kind: choice
    stem: 奇异值分解的形式是（ ）
    options: ["A=UΣV^T", "A=LU", "A=QR", "A=U+V"]
    answer: "A=UΣV^T"
    solution_outline: SVD 将矩阵分解为两个正交矩阵与对角矩阵。
  - id: grad-matrix-006-e2
    grade: m1
    difficulty: challenge
    kind: fill
    stem: QR 分解把一个矩阵分解为正交矩阵与（ ）矩阵的乘积
    answer: "上三角"
    solution_outline: Q 为正交矩阵，R 为上三角矩阵。
  - id: grad-matrix-006-e3
    grade: m1
    difficulty: challenge
    kind: match
    stem: 把分解与形式配对（写成 A=1;B=2 的形式）
    options: ["A LU 分解", "B SVD", "1 A=LU", "2 A=UΣV^T"]
    answer: "A=1;B=2"
    solution_outline: LU 为下上三角乘积，SVD 为三个矩阵乘积。
    variants: ["说明 QR 分解中 Q 与 R 的性质。"]
