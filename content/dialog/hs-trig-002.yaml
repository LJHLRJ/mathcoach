        acceptable:
          - "1"
          - "等于 1"
          - "sin²x+cos²x=1"
        template_prompt: "同角平方关系是什么？sin²x + cos²x 等于多少？"
        supplement_prompt: "再看同角平方关系：sin²x + cos²x 应该等于多少？"
        forbidden_in_prompt: ["=1"]
      - level: 4
        kc_ids: [kc-hs-trig-002-f1]
        expression: "sin(x)**2 + cos(x)**2"
        expected: "1"
        variables: [x]
        facts:
          focus: "化简 sin²x + cos²x"
        acceptable:
          - "1"
          - "化简为 1"
          - "结果是 1"
        template_prompt: "把 sin²x + cos²x 化简，结果是多少？"
        supplement_prompt: "只做化简：sin²x + cos²x 的结果是多少？"
        forbidden_in_prompt: ["=1"]

  - exercise_id: hs-trig-002-e2
    levels:
      - level: 3
        kc_ids: [kc-hs-trig-002-f1]
        expression: "1 - (3/5)**2"
        expected: "16/25"
        variables: []
        facts:
          sin_value: "3/5"
          focus: "cos²x"
        acceptable:
          - "16/25"
          - "0.64"
        template_prompt: "由 sin x = 3/5，先算 cos²x 的值。"
        supplement_prompt: "cos²x = 1 − sin²x。把 sin x = 3/5 代入，cos²x 等于多少？"
        forbidden_in_prompt: ["16/25", "0.64"]
      - level: 4
        kc_ids: [kc-hs-trig-002-f1]
        expression: "(3/5)**2 + 16/25"
        expected: "1"
        variables: []
        facts:
          sin_value: "3/5"
          cos_squared: "16/25"
          focus: "用平方和关系验证"
        acceptable:
          - "1"
          - "等于 1"
        template_prompt: "把 sin²x 用 (3/5)² 代入，cos²x 用 16/25 代入，sin²x + cos²x 的结果是多少？"
        supplement_prompt: "只看平方和：sin²x = (3/5)²，cos²x = 16/25，两者相加等于多少？"
        forbidden_in_prompt: ["等于 1", "=1"]

  - exercise_id: hs-trig-002-e3
    levels:
      - level: 3
        kc_ids: [kc-hs-trig-002-f1]
        expression: "sin(x)**2 + cos(x)**2"
        expected: "1"
        variables: [x]
        facts:
          focus: "可用的同角恒等式"
        acceptable:
          - "同角平方关系"
          - "sin²x+cos²x=1"
          - "平方和等于 1"
        template_prompt: "要化简 sin²x + cos²x，应该用哪条同角恒等式？"
        supplement_prompt: "先回想同角恒等式：sin²x 与 cos²x 的平方和满足什么关系？"
        forbidden_in_prompt: ["同角平方关系", "=1"]
      - level: 4
        kc_ids: [kc-hs-trig-002-f1]
        expression: "sin(x)**2 + cos(x)**2"
        expected: "1"
        variables: [x]
        facts:
          focus: "sin²x + cos²x 的值"
        acceptable:
          - "1"
          - "化简为 1"
          - "结果是 1"
        template_prompt: "sin²x + cos²x 的值是多少？"
        supplement_prompt: "直接用平方和关系，sin²x + cos²x 等于多少？"
        forbidden_in_prompt: ["=1"]
