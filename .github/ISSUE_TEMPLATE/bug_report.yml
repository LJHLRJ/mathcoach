name: Bug 报告
description: 报告可复现的问题
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认问题可复现，并尽量附上 `MATHCOACH_CONTENT_STRICT=1 python -m pytest -q` 的结果。
        安全漏洞请勿公开提交，按 SECURITY.md 私下报告。

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 选择…\n3. 点击…"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为（含报错栈或截图）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: "v0.7.1 或 commit SHA"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - Windows 安装版
        - Windows 便携版
        - macOS DMG
        - macOS 便携版
        - 从源码运行（Linux/macOS/Windows）
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本（从源码运行时填写）
      placeholder: "3.11 / 3.12 / 其他"

  - type: textarea
    id: tests
    attributes:
      label: pytest 结果摘要
      placeholder: "507 passed, 5 skipped；或粘贴失败用例输出"
