name: Verify installer wizard

on:
  workflow_dispatch:
  push:
    branches:
      - feat/installer-wizard

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-packaging.txt

      - name: Run tests
        env:
          MATHCOACH_CONTENT_STRICT: "1"
        run: python -m pytest -q

      - name: Build desktop app
        run: python scripts/build_desktop.py

      - name: Build Windows installer
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          $version = python -c "import mathcoach; print(mathcoach.__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "scripts\installer\MathCoach.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "dist\installer\MathCoachSetup-$version.exe")) {
            throw "Installer not found"
          }

      - name: Verify Information page
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $version = python -c "import mathcoach; print(mathcoach.__version__)"
          $installer = (Resolve-Path "dist\installer\MathCoachSetup-$version.exe").Path
          $loader = Start-Process -FilePath $installer -ArgumentList "/LOG=ui-check.log" -PassThru

          Add-Type -TypeDefinition @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class Win32Wizard {
              public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
              [DllImport("user32.dll")]
              public static extern bool EnumWindows(EnumProc lpEnumFunc, IntPtr lParam);
              [DllImport("user32.dll")]
              public static extern bool EnumChildWindows(IntPtr hWndParent, EnumProc lpEnumFunc, IntPtr lParam);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern int GetWindowText(IntPtr hWnd, StringBuilder lpString, int nMaxCount);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern IntPtr SendMessage(IntPtr hWnd, uint Msg, IntPtr wParam, StringBuilder lParam);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern int GetClassName(IntPtr hWnd, StringBuilder lpClassName, int nMaxCount);
              [DllImport("user32.dll")]
              public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);
              [StructLayout(LayoutKind.Sequential)]
              public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect);
          }
          "@

          $deadline = (Get-Date).AddSeconds(60)
          $installerWindow = [IntPtr]::Zero
          while ((Get-Date) -lt $deadline -and $installerWindow -eq [IntPtr]::Zero) {
            $script:candidates = New-Object System.Collections.Generic.List[object]
            $topCallback = [Win32Wizard+EnumProc]{
              param([IntPtr]$hWnd, [IntPtr]$lParam)
              $buffer = New-Object System.Text.StringBuilder 512
              [void][Win32Wizard]::GetWindowText($hWnd, $buffer, $buffer.Capacity)
              if ($buffer.ToString() -match "MathCoach") {
                $script:candidates.Add([pscustomobject]@{ Handle = $hWnd; Title = $buffer.ToString() })
              }
              return $true
            }
            [void][Win32Wizard]::EnumWindows($topCallback, [IntPtr]::Zero)
            if ($script:candidates.Count -gt 0) {
              $installerWindow = $script:candidates[0].Handle
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if ($installerWindow -eq [IntPtr]::Zero) {
            throw "Installer window did not appear"
          }
          Start-Sleep -Seconds 2

          $script:windowTexts = New-Object System.Collections.Generic.List[string]
          $childCallback = [Win32Wizard+EnumProc]{
            param([IntPtr]$hWnd, [IntPtr]$lParam)
            $classBuffer = New-Object System.Text.StringBuilder 256
            [void][Win32Wizard]::GetClassName($hWnd, $classBuffer, $classBuffer.Capacity)
            $buffer = New-Object System.Text.StringBuilder 32768
            [void][Win32Wizard]::GetWindowText($hWnd, $buffer, $buffer.Capacity)
            $text = $buffer.ToString()
            if ($text.Length -eq 0) {
              $sendBuffer = New-Object System.Text.StringBuilder 32768
              [void][Win32Wizard]::SendMessage($hWnd, 0x000D, [IntPtr]$sendBuffer.Capacity, $sendBuffer)
              $text = $sendBuffer.ToString()
            }
            if ($text.Length -gt 0) {
              $script:windowTexts.Add("[" + $classBuffer.ToString() + "] " + $text)
            }
            return $true
          }
          [void][Win32Wizard]::EnumChildWindows($installerWindow, $childCallback, [IntPtr]::Zero)

          try {
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            $root = [System.Windows.Automation.AutomationElement]::FromHandle($installerWindow)
            $elements = $root.FindAll(
              [System.Windows.Automation.TreeScope]::Descendants,
              [System.Windows.Automation.Condition]::TrueCondition
            )
            foreach ($element in $elements) {
              try {
                $name = $element.Current.Name
                if ($name) {
                  $script:windowTexts.Add($name)
                }
                try {
                  $textPattern = $element.GetCurrentPattern([System.Windows.Automation.TextPattern]::Pattern)
                  $text = $textPattern.DocumentRange.GetText(-1)
                  if ($text) {
                    $script:windowTexts.Add($text)
                  }
                } catch {
                  continue
                }
              } catch {
                continue
              }
            }
          } catch {
            Write-Warning "UIAutomation fallback failed: $_"
          }

          $titleBuffer = New-Object System.Text.StringBuilder 512
          [void][Win32Wizard]::GetWindowText($installerWindow, $titleBuffer, $titleBuffer.Capacity)
          $joined = ($script:windowTexts -join "`n") + "`n" + $titleBuffer.ToString()
          $joined | Out-File -FilePath "information-page-text.txt" -Encoding utf8
          Write-Host "----- installer window text -----"
          Write-Host $joined
          Write-Host "---------------------------------"

          if ($joined -notmatch "Information") {
            Write-Warning "Page title 'Information' not found in window text"
          }
          if ($joined -notmatch "MathCoach 安装前说明") {
            throw "Chinese notice heading not found"
          }
          if ($joined -notmatch "不会上传到任何服务器") {
            throw "Data boundary text not found"
          }

          Add-Type -AssemblyName System.Drawing
          try {
            $rect = [Win32Wizard+RECT]::new()
            [void][Win32Wizard]::GetWindowRect($installerWindow, [ref]$rect)
            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            if ($width -gt 0 -and $height -gt 0) {
              $bitmap = New-Object System.Drawing.Bitmap $width, $height
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bitmap.Size)
              $bitmap.Save("information-page.png", [System.Drawing.Imaging.ImageFormat]::Png)
              $graphics.Dispose()
              $bitmap.Dispose()
            }
          } catch {
            Write-Warning "Screenshot failed: $_"
          }

          $ownerPid = 0
          [void][Win32Wizard]::GetWindowThreadProcessId($installerWindow, [ref]$ownerPid)
          $owner = Get-Process -Id $ownerPid -ErrorAction SilentlyContinue
          if ($owner) {
            $owner.CloseMainWindow() | Out-Null
            Start-Sleep -Seconds 2
            if (-not $owner.HasExited) {
              $owner.Kill()
            }
          }
          if (-not $loader.HasExited) {
            $loader.Kill()
          }

      - name: Verify default autostart is off
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          Remove-ItemProperty -Path $run -Name MathCoach -ErrorAction SilentlyContinue
          $version = python -c "import mathcoach; print(mathcoach.__version__)"
          $installer = (Resolve-Path "dist\installer\MathCoachSetup-$version.exe").Path

          $install = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=install-default.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer failed with exit code $($install.ExitCode)"
          }

          $value = (Get-ItemProperty -Path $run -Name MathCoach -ErrorAction SilentlyContinue).MathCoach
          if ($null -ne $value) {
            throw "Autostart value was written by default: $value"
          }
          Write-Host "Default autostart off: OK"

          $exe = Join-Path $env:LOCALAPPDATA "Programs\MathCoach\MathCoach.exe"
          if (-not (Test-Path $exe)) {
            throw "Installed executable missing: $exe"
          }

          $uninstaller = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs\MathCoach") -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) {
            throw "Uninstaller missing"
          }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=uninstall-default.log" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller failed with exit code $($uninstall.ExitCode)"
          }
          Start-Sleep -Seconds 3

          $value = (Get-ItemProperty -Path $run -Name MathCoach -ErrorAction SilentlyContinue).MathCoach
          if ($null -ne $value) {
            throw "Autostart value was not removed after uninstall: $value"
          }
          Write-Host "Uninstall removed startup value: OK"

      - name: Verify autostart selection and uninstall removal
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $version = python -c "import mathcoach; print(mathcoach.__version__)"
          $installer = (Resolve-Path "dist\installer\MathCoachSetup-$version.exe").Path
          $exe = Join-Path $env:LOCALAPPDATA "Programs\MathCoach\MathCoach.exe"

          $install = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS="autostart" /LOG=install-autostart.log' -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer failed with exit code $($install.ExitCode)"
          }

          $value = (Get-ItemProperty -Path $run -Name MathCoach -ErrorAction SilentlyContinue).MathCoach
          $expected = '"' + $exe + '"'
          if ($value -ne $expected) {
            throw "Unexpected autostart value: '$value'; expected '$expected'"
          }
          Write-Host "Autostart value: $value"

          $uninstaller = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs\MathCoach") -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) {
            throw "Uninstaller missing"
          }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=uninstall-autostart.log" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller failed with exit code $($uninstall.ExitCode)"
          }
          Start-Sleep -Seconds 3

          $value = (Get-ItemProperty -Path $run -Name MathCoach -ErrorAction SilentlyContinue).MathCoach
          if ($null -ne $value) {
            throw "Autostart value was not removed after uninstall: $value"
          }
          Write-Host "Autostart removed after uninstall: OK"

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-verification
          path: |
            information-page-text.txt
            information-page.png
            ui-check.log
            install-default.log
            uninstall-default.log
            install-autostart.log
            uninstall-autostart.log
            dist/installer/*.exe
          if-no-files-found: warn
          retention-days: 7
