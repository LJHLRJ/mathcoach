name: Build desktop release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            portable: MathCoach-windows.zip
          - os: macos-latest
            portable: MathCoach-macos.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-packaging.txt

      - name: Run tests
        env:
          MATHCOACH_CONTENT_STRICT: "1"
        run: python -m pytest -q

      - name: Build desktop app
        run: python scripts/build_desktop.py

      - name: Archive portable Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MathCoach -DestinationPath ${{ matrix.portable }} -Force

      - name: Archive portable macOS
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/MathCoach.app ${{ matrix.portable }}

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          $version = python -c "import mathcoach; print(mathcoach.__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "scripts\installer\MathCoach.iss"

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/build_macos_dmg.sh

      - name: Upload Windows assets
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python -c "import mathcoach; print(mathcoach.__version__)")
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ matrix.portable }}" \
            "dist/installer/MathCoachSetup-$version.exe" \
            --clobber

      - name: Upload macOS assets
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python -c "import mathcoach; print(mathcoach.__version__)")
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ matrix.portable }}" \
            "dist/installer/MathCoach-$version.dmg" \
            --clobber
