name: Visual regression

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    name: Screenshot regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-visual.txt

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-visual.txt

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run screenshot regression
        env:
          VISUAL_REQUIRE_BROWSER: "1"
          VISUAL_MAX_DIFF_RATIO: "0.005"
        run: >-
          python -m pytest
          tests/test_visual_regression.py
          tests/test_visual_workflow.py
          -v

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-screenshots
          path: tests/visual/artifacts/
          if-no-files-found: warn
          retention-days: 14
