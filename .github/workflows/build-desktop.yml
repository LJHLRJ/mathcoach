name: Build desktop artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-packaging.txt

      - name: Build desktop app
        run: python scripts/build_desktop.py --output-dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathCoach-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
