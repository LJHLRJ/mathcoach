[project]
name = "mathcoach"
version = "0.1.0"
description = "本地优先的数学陪练软件（Streamlit）"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.36",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "openai>=1.30",
  "sympy>=1.12",
  "platformdirs>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mathcoach*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
