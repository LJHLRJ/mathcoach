[theme]
# 原值（v0.7.0）：base=light, primaryColor=#4F8BF9, backgroundColor=#FFFFFF,
# secondaryBackgroundColor=#F0F2F6, textColor=#262730, font=sans serif,
# greenColor=#28a745, redColor=#dc3545。
# 主题变更需重启 Streamlit 生效；运行时不提供真假切换。
base = "light"
primaryColor = "#4F8BF9"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"
greenColor = "#28a745"
redColor = "#dc3545"

[server]
enableStaticServing = true
