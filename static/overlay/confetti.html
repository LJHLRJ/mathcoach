<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MathCoach celebration</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="confetti.browser.js"></script>
  <script>
    (function () {
      if (
        window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches
      ) {
        return;
      }
      var colors = ['#4F8BF9', '#28a745', '#f0ad4e', '#dc3545'];
      var end = Date.now() + 1200;
      function burst() {
        confetti({
          particleCount: 3,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: colors
        });
        confetti({
          particleCount: 3,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: colors
        });
        if (Date.now() < end) {
          requestAnimationFrame(burst);
        }
      }
      burst();
    })();
  </script>
</body>
</html>
